# KeyShift Lab: Redis, the controller with its dashboard, and simulated
# services generating traffic. Start with `make docker-up`, then open
# http://localhost:8080 and sign in with the viewer or admin token from
# lab.env.
name: keyshift-lab
services:
  redis:
    image: redis:8.6
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 1s, retries: 30 }

  controller:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: controller }
    image: keyshift/controller:dev
    env_file: lab.env
    environment:
      KEYSHIFT_DATA_DIR: /data
    command: ["--addr", ":8080", "--aggregate-interval", "5s", "--instance-min-interval", "2s"]
    ports: ["8080:8080"]
    volumes: ["controller-data:/data"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/keyshift-controller", "healthcheck"]
      interval: 2s
      retries: 30

  demo:
    # Six simulated pods across two services with read-heavy, write-heavy,
    # and pod-local keys.
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: lab }
    image: keyshift/lab:dev
    env_file: lab.env
    entrypoint: ["/keyshift-demo"]
    command: ["-redis", "redis:6379", "-controller", "http://controller:8080", "-pods", "3", "-rate", "2000", "-window", "5s", "-report", "10s"]
    depends_on:
      redis: { condition: service_healthy }
      controller: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]

  product-service:
    image: keyshift/lab:dev
    env_file: lab.env
    environment:
      KEYSHIFT_CONTROLLER: http://controller:8080
    entrypoint: ["/product-service"]
    command: ["-redis", "redis:6379", "-listen", ":8090"]
    ports: ["8090:8090"]
    depends_on:
      redis: { condition: service_healthy }
      demo: { condition: service_started }
    read_only: true
    security_opt: ["no-new-privileges:true"]

volumes:
  controller-data: {}
