version: 2
project_name: keyshift
builds:
  - id: keyshift
    main: ./cmd/keyshift
    binary: keyshift
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: keyshift-controller
    main: ./cmd/keyshift-controller
    binary: keyshift-controller
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  sort: asc
