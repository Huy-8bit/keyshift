name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }

  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}" }
      - run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: make test-fuzz FUZZTIME=5s

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Integration and fault tests (Redis 8.6, 7.4, Cluster)
        run: make test-integration
      - name: Benchmark smoke (lightweight CI mode)
        run: |
          go run ./cmd/keyshift bench -redis localhost:16379 -yes \
            -scenarios zipf,write-heavy -duration 3s -warmup 3s -concurrency 16 \
            -markdown bench-smoke.md
      - name: Logical simulation smoke (500 instances)
        run: go run ./cmd/keyshift simulate -services 10 -instances-per-service 50 -rounds 2
      - uses: actions/upload-artifact@v4
        with: { name: bench-smoke, path: bench-smoke.md }
      - if: always()
        run: make test-infra-down

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make build
      - uses: docker/setup-buildx-action@v4
      - name: Container images
        run: make docker-build VERSION=ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
