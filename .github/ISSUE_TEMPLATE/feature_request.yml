name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What workload or operational problem are you trying to solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: tradeoffs
    attributes: { label: Correctness and resource tradeoffs, description: How does this interact with invalidation safety and resource bounds? }
